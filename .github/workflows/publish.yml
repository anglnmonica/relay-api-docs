# Publishes the docs site to GitHub Pages on every push to main, and every
# Monday, so the docs health report shows reviews as they come due.
# One-time setup: in the repository's Settings > Pages, set Source to
# "GitHub Actions".

name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * 1" # Mondays at 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build the site
        run: mkdocs build --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Publishes the report at /relay-api-docs/docs-health/.
      - name: Build the docs health report
        run: node scripts/health/report.mjs --title "Relay API docs health" --out site/docs-health docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
