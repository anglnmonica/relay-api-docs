# API spec checks. Run on every pull request and every push to main.
#   - Spec lint: Spectral checks that api/openapi.yaml is valid OpenAPI, and
#     that every operation, parameter, and field has a description and every
#     request and response has an example. Rules are in .spectral.yaml.
#   - Reference drift: the reference pages are generated from the spec. This
#     check fails if someone changed one without the other.

name: API checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-lint:
    name: Spec lint (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint the OpenAPI spec
        run: npx --yes @stoplight/spectral-cli@6 lint api/openapi.yaml --ruleset .spectral.yaml --fail-severity error

  reference-drift:
    name: Reference matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyyaml
      - name: Check that the reference pages match the spec
        run: python3 api/generate_reference.py --check
